<!DOCTYPE html>
<html>
<head>
    <title>C++ Boids</title>
    <style>
        body { background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { background-color: #111; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <canvas id="boidsCanvas" width="800" height="800"></canvas>

    <script src="boids.js"></script>

    <script>
        const canvas = document.getElementById('boidsCanvas');
        const ctx = canvas.getContext('2d');
        const NUM_BOIDS = 150; // Let's spawn 100 of them!

        // Emscripten triggers this function the moment the C++ binary is fully loaded in memory
        Module.onRuntimeInitialized = () => {
            
            // 1. Tell C++ to create the boids
            Module._init_system(NUM_BOIDS);
            
            // 2. Get the memory address (the vault key) from C++
            const ptr = Module._get_boids_pointer();

            function renderLoop() {
                // 3. Tell C++ to run one frame of your physics math
                Module._simulate_frame();

                // Clear the canvas black for the new frame
                ctx.clearRect(0, 0, 800, 800);
                ctx.fillStyle = "#00ffcc"; // Neon blue color for the birds

                // 4. Read the raw memory bytes from C++! 
                // We read NUM_BOIDS * 6 because each Boid has 6 doubles (posX, posY, velX, velY, accX, accY)
                const boidsData = new Float64Array(Module.HEAPF64.buffer, ptr, NUM_BOIDS * 6);

                for (let i = 0; i < NUM_BOIDS; i++) {
                    // Extract X and Y. We multiply by 80 because your C++ grid is 10x10, and our canvas is 800x800.
                    let x = boidsData[i * 6] * 80;
                    let y = boidsData[i * 6 + 1] * 80;

                    // Draw a simple dot for the boid
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 5. Ask the browser to loop this function 60 times a second
                requestAnimationFrame(renderLoop);
            }

            // Kick off the loop
            renderLoop();
        };
    </script>
</body>
</html>
